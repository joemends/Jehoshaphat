<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Client Portal | Jehoshaphat Mends</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase.js"></script></head><body><main class="admin-shell"><div class="container"><section id="clientLogin" class="admin-panel" style="max-width:560px;margin:7vh auto"><span class="eyebrow">Client portal</span><h1 class="page-title" style="font-size:46px">Your project space.</h1><p class="muted">Sign in to track work, view invoices and message Jehoshaphat.</p><div class="portal-tabs"><button class="btn active" data-auth-tab="login">Login</button><button class="btn" data-auth-tab="signup">Create account</button></div><form id="clientLoginForm" class="form"><div class="field"><label>Email</label><input id="clEmail" type="email" required></div><div class="field"><label>Password</label><input id="clPassword" type="password" required></div><button class="btn primary">Login</button><p id="clLoginStatus" class="notice"></p></form><form id="clientSignupForm" class="form hidden"><div class="field"><label>Full name</label><input id="csName" required></div><div class="field"><label>Company</label><input id="csCompany"></div><div class="field"><label>Phone</label><input id="csPhone"></div><div class="field"><label>Email</label><input id="csEmail" type="email" required></div><div class="field"><label>Password</label><input id="csPassword" type="password" minlength="8" required></div><button class="btn primary">Create client account</button><p id="clSignupStatus" class="notice"></p></form></section>
<section id="clientApp" class="hidden"><div class="portal-head"><div><span class="eyebrow">Client portal</span><h1 id="clientName" class="page-title" style="font-size:46px">Welcome</h1></div><button id="clientLogout" class="btn">Log out</button></div><div class="portal-grid"><aside class="admin-sidebar"><div class="admin-nav"><button class="active" data-client-tab="overview">Overview</button><button data-client-tab="work">My work</button><button data-client-tab="invoices">Invoices</button><button data-client-tab="messages">Messages <span id="clientMsgBadge" class="message-badge hidden">0</span></button></div></aside><div class="admin-panel"><div id="overview" class="client-section active"><div class="stat-grid"><div class="stat-card"><strong id="statProjects">0</strong><span>Projects</span></div><div class="stat-card"><strong id="statInvoices">0</strong><span>Invoices</span></div><div class="stat-card"><strong id="statUpdates">0</strong><span>Work updates</span></div></div><div class="section-head"><div><h2>Latest updates</h2><p class="muted">Progress from your designer.</p></div></div><div id="overviewUpdates" class="admin-list"></div></div><div id="work" class="client-section"><h2>My work</h2><div id="clientProjects" class="admin-list"></div><div id="clientUpdates" class="admin-list"></div></div><div id="invoices" class="client-section"><h2>Invoices</h2><div id="clientInvoices" class="admin-list"></div></div><div id="messages" class="client-section"><div class="section-head"><div><h2>Messages</h2><p class="muted">Message the designer directly.</p></div></div><div id="clientMessages" class="admin-list"></div><form id="clientMessageForm" class="form"><div class="field"><label>Message</label><textarea id="clientMessageText" required placeholder="Write a message..."></textarea></div><button class="btn primary">Send message</button><p id="clientMessageStatus" class="notice"></p></form></div></div></div></section></div></main><script src="client.js"></script></body></html>
